name: Update Profile

on:
  schedule:
    - cron: "0 12 * * *"

  workflow_dispatch:


jobs:
  update:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"


    - name: Install dependencies
      run: |
        pip install pillow requests


    - name: Generate SVG
      run: |
        python scripts/fetch_contributions.py
        python scripts/generate_card.py
        python scripts/make_avatar.py
        python scripts/render_heatmap.py


    - name: Commit changes
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "actions@github.com"

        git add .

        git commit -m "Update profile graphics" || exit 0

        git push